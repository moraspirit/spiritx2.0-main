<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <!-- Gold Visor Gradients -->
    <radialGradient id="visorGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Space Suit Shading -->
    <linearGradient id="suitWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="suitDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Visor Starlight Reflection Flare -->
    <linearGradient id="starlightFlare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(400, 390)">
    <!-- 1. Life Support Backpack (PLSS) -->
    <rect x="-140" y="-190" width="280" height="340" rx="36" fill="url(#suitDark)" stroke="#475569" stroke-width="4"/>
    <rect x="-110" y="-170" width="220" height="45" rx="14" fill="#1e293b"/>
    <circle cx="-75" cy="-147" r="10" fill="#06b6d4"/>
    <circle cx="-45" cy="-147" r="8" fill="#10b981"/>
    <circle cx="-15" cy="-147" r="8" fill="#f59e0b"/>

    <!-- Oxygen Hose Ribs -->
    <path d="M -110 -80 C -150 -50, -170 80, -120 130" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 110 -80 C 150 -50, 170 80, 120 130" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- 2. Suit Torso & Shoulders -->
    <!-- Torso -->
    <path d="M -125 -60 C -135 120, -115 220, 0 240 C 115 220, 135 120, 125 -60 C 90 -70, -90 -70, -125 -60 Z" fill="url(#suitWhite)"/>

    <!-- Left Arm & Glove reaching toward camera -->
    <g transform="rotate(-15, -125, -50)">
      <path d="M -125 -50 C -190 -20, -230 40, -210 110 C -190 140, -160 110, -145 70 C -135 40, -115 0, -125 -50 Z" fill="url(#suitWhite)"/>
      <!-- Glove -->
      <ellipse cx="-215" cy="115" rx="34" ry="26" fill="#334155"/>
      <path d="M -235 110 C -255 100, -260 125, -235 130 Z" fill="#475569"/>
      <path d="M -225 132 C -245 138, -240 152, -220 144 Z" fill="#475569"/>
      <path d="M -205 138 C -220 150, -210 162, -195 148 Z" fill="#475569"/>
    </g>

    <!-- Right Arm & Glove reaching toward camera -->
    <g transform="rotate(15, 125, -50)">
      <path d="M 125 -50 C 190 -20, 230 40, 210 110 C 190 140, 160 110, 145 70 C 135 40, 115 0, 125 -50 Z" fill="url(#suitWhite)"/>
      <!-- Glove -->
      <ellipse cx="215" cy="115" rx="34" ry="26" fill="#334155"/>
      <path d="M 235 110 C 255 100, 260 125, 235 130 Z" fill="#475569"/>
      <path d="M 225 132 C 245 138, 240 152, 220 144 Z" fill="#475569"/>
      <path d="M 205 138 C 220 150, 210 162, 195 148 Z" fill="#475569"/>
    </g>

    <!-- Chest Remote Control Module (DCM) -->
    <rect x="-65" y="10" width="130" height="110" rx="14" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- Status Screen -->
    <rect x="-50" y="24" width="100" height="40" rx="6" fill="#0284c7"/>
    <text x="0" y="48" font-family="'Space Grotesk', monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">EVA: OPTIMAL</text>
    <!-- Control Dials -->
    <circle cx="-35" cy="90" r="10" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="90" r="10" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
    <circle cx="35" cy="90" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>

    <!-- 3. Space Helmet Shell -->
    <ellipse cx="0" cy="-140" rx="135" ry="145" fill="url(#suitWhite)" stroke="#94a3b8" stroke-width="3"/>
    <!-- Helmet Neck Ring -->
    <ellipse cx="0" cy="-25" rx="90" ry="20" fill="#334155" stroke="#cbd5e1" stroke-width="4"/>

    <!-- 4. Massive Curved Golden Mirror Visor -->
    <ellipse cx="0" cy="-145" rx="112" ry="118" fill="url(#visorGold)" stroke="#fef08a" stroke-width="4" filter="url(#goldGlow)"/>

    <!-- Visor Cosmic Earth & Stars Reflection -->
    <ellipse cx="30" cy="-175" rx="24" ry="24" fill="#38bdf8" opacity="0.6"/>
    <circle cx="38" cy="-180" r="16" fill="#1d4ed8" opacity="0.7"/>

    <!-- Visor Horizon Starlight Reflection -->
    <path d="M -90 -130 Q 0 -90, 90 -130" stroke="#fef08a" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- High-Glint Starlight Flare across Visor -->
    <ellipse cx="-35" cy="-185" rx="45" ry="14" fill="url(#starlightFlare)" transform="rotate(-30, -35, -185)"/>
    <circle cx="-35" cy="-185" r="5" fill="#ffffff"/>

    <!-- Helmet Sun Shield Clip-ons -->
    <rect x="-132" y="-155" width="14" height="40" rx="4" fill="#1e293b"/>
    <rect x="118" y="-155" width="14" height="40" rx="4" fill="#1e293b"/>
  </g>
</svg>
